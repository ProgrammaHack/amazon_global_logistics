<!DOCTYPE html>
<html>
<head>
  <title>Global Inventory Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      background: #f4f6f9;
    }

    .sidebar {
      width: 260px;
      background: #111827;
      color: white;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .sidebar h2 {
      margin-top: 0;
      font-size: 18px;
    }

    select, input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .main {
      flex: 1;
      padding: 20px;
      box-sizing: border-box;
    }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: white;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .panel h3 {
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      overflow: hidden;
      border-radius: 8px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f3f4f6;
    }

    tr:hover {
      background: #f9fafb;
      cursor: pointer;
    }

    .muted {
      color: #6b7280;
      font-size: 13px;
    }

    .stats {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .stat {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
    }

    .reviews-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2><i class="fa-solid fa-boxes-stacked"></i> Dashboard</h2>

    <label class="muted">Seller</label>
    <select id="seller" onchange="loadData()"></select>

    <label class="muted">Filter type</label>
    <select id="filter" onchange="loadData()">
      <option value="all">All</option>
      <option value="physical">Physical</option>
      <option value="digital">Digital</option>
      <option value="bundle">Bundle</option>
    </select>

    <label class="muted">Update selected product price</label>
    <input id="newPrice" type="number" step="0.01" placeholder="New price">
    <button onclick="updatePrice()">
      <i class="fa-solid fa-pen-to-square"></i> Update Price
    </button>
  </div>

  <div class="main">
    <div class="layout">
      <div class="panel">
        <div class="section-title">Products</div>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Price</th>
              <th>Stock</th>
            </tr>
          </thead>
          <tbody id="assets"></tbody>
        </table>
      </div>

      <div>
        <div class="panel">
          <div class="section-title">Seller totals</div>
          <div id="info" class="stats"></div>
        </div>

        <div class="panel" style="margin-top:16px;">
          <div class="section-title">Reviews</div>
          <div id="reviews" class="muted">Select a product</div>
        </div>

        <div class="panel" style="margin-top:16px;">
          <div class="section-title">Selected product</div>
          <div id="selectedProduct" class="muted">Nothing selected</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = "http://localhost:3000/api"
    let selectedAssetId = null

    async function loadSellers() {
      const res = await fetch(API + "/sellers")
      const data = await res.json()

      document.getElementById("seller").innerHTML =
        data.map(s => `<option value="${s._id}">${s.name}</option>`).join("")
    }

    async function loadData() {
      const seller = document.getElementById("seller").value
      const filter = document.getElementById("filter").value

      if (!seller) return

      const res = await fetch(API + "/seller-view/" + seller)
      const data = await res.json()

      let items = data.items
      if (filter !== "all") {
        items = items.filter(i => i.type === filter)
      }

      document.getElementById("assets").innerHTML = items.map(a => `
        <tr onclick="selectProduct('${a.assetId}', '${a.name}', ${a.price})">
          <td>${a.name}</td>
          <td>${a.type}</td>
          <td>${a.price.toFixed(2)}</td>
          <td>${a.stock}</td>
        </tr>
      `).join("")

      document.getElementById("info").innerHTML = `
        <div class="stat"><strong>Total Products:</strong> ${data.totalProducts}</div>
        <div class="stat"><strong>Total Units:</strong> ${data.totalUnits}</div>
        <div class="stat"><strong>Total Value:</strong> ${data.totalValue.toFixed(2)}</div>
      `

      if (selectedAssetId) {
        loadReviews(selectedAssetId)
      }
    }

    async function selectProduct(assetId, name, price) {
      selectedAssetId = assetId
      document.getElementById("selectedProduct").innerHTML = `
        <div><strong>${name}</strong></div>
        <div class="muted">Asset ID: ${assetId}</div>
        <div class="muted">Current price: ${price.toFixed(2)}</div>
      `
      loadReviews(assetId)
    }

    async function loadReviews(assetId) {
      const res = await fetch(API + "/reviews/" + assetId)
      const data = await res.json()

      document.getElementById("reviews").innerHTML = data.length
        ? data.map(r => `
            <div class="reviews-item">
              <strong>${r.userId}</strong> — Rating: ${r.rating}/5
            </div>
          `).join("")
        : "<div class='muted'>No reviews</div>"
    }

    async function updatePrice() {
      if (!selectedAssetId) {
        alert("Select a product first")
        return
      }

      const price = document.getElementById("newPrice").value
      if (!price) {
        alert("Insert a valid price")
        return
      }

      const res = await fetch(API + "/assets/" + selectedAssetId + "/price", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ price: Number(price) })
      })

      const result = await res.json()

      if (!res.ok) {
        alert(result.error || "Error updating price")
        return
      }

      document.getElementById("newPrice").value = ""
      loadData()
      loadReviews(selectedAssetId)
      alert("Price updated")
    }

    loadSellers().then(loadData)
  </script>
</body>
</html>
